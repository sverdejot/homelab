---
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: vaultwarden
  name: vaultwarden-pvc
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vaultwarden
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      # Build a CA bundle = system roots + homelab internal CA (trust-manager
      # Bundle `custom-ca-bundle`), so SSO discovery against identity.home.lab
      # verifies TLS while public endpoints (icons, HIBP, push) keep working.
      initContainers:
        - name: ca-bundle
          image: vaultwarden/server:1.37.5
          command:
            - sh
            - -c
            - cat /etc/ssl/certs/ca-certificates.crt /internal-ca/ca-bundle.crt > /certs/ca-certificates.crt
          volumeMounts:
            - name: internal-ca
              mountPath: /internal-ca
              readOnly: true
            - name: certs
              mountPath: /certs
          resources:
            requests:
              memory: "16Mi"
            limits:
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.5
          env:
            - name: DOMAIN
              value: https://vault.home.lab
            - name: ROCKET_PORT
              value: "8080"
            # Set to "true" only to create the first account, then back to "false".
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "false"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            - name: PASSWORD_HINTS_ALLOWED
              value: "false"
            # SSO via authentik (master password login kept as fallback)
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false"
            # Must match the issuer exactly (trailing slash included)
            - name: SSO_AUTHORITY
              value: https://identity.home.lab/application/o/vaultwarden/
            - name: SSO_CLIENT_ID
              value: vaultwarden
            - name: SSO_SCOPES
              value: email profile offline_access
            # No new accounts via SSO; existing accounts are linked by email
            - name: SSO_SIGNUPS_ALLOWED
              value: "false"
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSL_CERT_FILE
              value: /certs/ca-certificates.crt
          envFrom:
            - secretRef:
                name: vaultwarden-sso
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /alive
              port: 8080
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-pvc
        - name: internal-ca
          configMap:
            name: custom-ca-bundle
        - name: certs
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: vaultwarden
  name: vaultwarden-svc
  namespace: vaultwarden
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: vaultwarden
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-ingress
  namespace: vaultwarden
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 128m
    cert-manager.io/cluster-issuer: certificate-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vault.home.lab
      secretName: vaultwarden-tls
  rules:
    - host: vault.home.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden-svc
                port:
                  number: 8080
