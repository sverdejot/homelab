# Glance start page for home.lab. Docs: https://github.com/glanceapp/glance/blob/v0.8.7/docs/configuration.md
# Glance reloads this file on change; the ConfigMap is regenerated by kustomize.
server:
  proxied: true
  assets-path: /app/assets

document:
  head: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">

branding:
  app-name: home.lab
  logo-url: /assets/avatar-dark.svg
  favicon-url: /assets/avatar-dark.svg
  app-background-color: "#282828"
  hide-footer: true

# Gruvbox, like www.sverdejot.dev: dark by default, paper as the light preset.
theme:
  background-color: 0 0 16
  primary-color: 27 99 55
  positive-color: 61 66 44
  negative-color: 6 96 59
  contrast-multiplier: 1.1
  custom-css-file: /assets/home.css
  presets:
    default-dark:
      background-color: 0 0 16
      primary-color: 27 99 55
      positive-color: 61 66 44
      negative-color: 6 96 59
      contrast-multiplier: 1.1
    default-light:
      light: true
      background-color: 48 64 92
      primary-color: 24 88 45
      positive-color: 60 71 35
      negative-color: 2 75 46
      contrast-multiplier: 1.1

pages:
  - name: Inicio
    slug: home
    columns:
      - size: small
        widgets:
          - type: clock
            title: Hora
            hour-format: 24h
          - type: weather
            title: Tiempo
            location: Madrid, Spain
            units: metric
            hour-format: 24h
          - type: calendar
            title: Calendario
            first-day-of-week: monday

      - size: full
        widgets:
          - type: search
            hide-header: true
            search-engine: duckduckgo
            placeholder: Buscar…
            autofocus: true
            bangs:
              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}
              - title: Artifact Hub
                shortcut: "!ah"
                url: https://artifacthub.io/packages/search?ts_query_web={QUERY}

          - type: monitor
            title: Día a día
            cache: 1m
            sites:
              - title: Vaultwarden
                url: https://vault.home.lab
                check-url: http://vaultwarden-svc.vaultwarden.svc.cluster.local:8080/alive
                icon: di:vaultwarden
              - title: Homebox
                url: https://homebox.home.lab
                check-url: http://homebox-svc.homebox.svc.cluster.local:7745/api/v1/status
                icon: di:homebox
              - title: n8n
                url: https://n8n.home.lab
                check-url: http://n8n-svc.n8n.svc.cluster.local:5678/healthz
                icon: di:n8n

          - type: monitor
            title: Plataforma
            cache: 1m
            sites:
              - title: Grafana
                url: https://grafana.home.lab
                check-url: http://grafana.grafana.svc.cluster.local/api/health
                icon: di:grafana
              - title: Prometheus
                url: https://prometheus.home.lab
                check-url: http://prometheus-server.prometheus.svc.cluster.local/-/healthy
                icon: di:prometheus
              - title: Argo CD
                url: https://argo.home.lab
                check-url: http://argocd-server.argocd.svc.cluster.local/healthz
                icon: di:argo-cd
              - title: Longhorn
                url: https://longhorn.home.lab
                check-url: http://longhorn-frontend.longhorn-system.svc.cluster.local/
                icon: di:longhorn
              - title: Pi-hole
                url: https://dns.home.lab/admin/
                check-url: http://pihole-web.pihole-system.svc.cluster.local/admin/login.php
                icon: di:pi-hole
              - title: authentik
                url: https://identity.home.lab
                check-url: http://authentik-server.authentik.svc.cluster.local/-/health/live/
                icon: di:authentik
                timeout: 6s

      - size: small
        widgets:
          # Firing alerts from Alertmanager (silenced/inhibited ones hidden)
          - type: custom-api
            title: Alertas
            title-url: https://prometheus.home.lab/alerts
            cache: 1m
            url: http://prometheus-alertmanager.prometheus.svc.cluster.local:9093/api/v2/alerts?active=true&silenced=false&inhibited=false
            template: |
              {{ $alerts := .JSON.Array "" }}
              {{ if eq (len $alerts) 0 }}
                <p class="color-positive">✓ sin alertas</p>
              {{ else }}
                <ul class="list list-gap-10">
                {{ range $alerts }}
                  <li>
                    <div class="size-h4 {{ if eq (.String "labels.severity") "critical" }}color-negative{{ else }}color-highlight{{ end }}">{{ .String "labels.alertname" }}</div>
                    <div class="size-h6 color-subdue">{{ .String "annotations.summary" }}</div>
                    <ul class="list-horizontal-text size-h6">
                      <li>{{ .String "labels.severity" }}</li>
                      <li>{{ .String "labels.node" }}{{ .String "labels.namespace" }}</li>
                      <li {{ .String "startsAt" | parseRelativeTime "rfc3339" }}></li>
                    </ul>
                  </li>
                {{ end }}
                </ul>
              {{ end }}

          # The four Raspberry Pis, from node-exporter through Prometheus.
          # One query returns every stat tagged with an `m` label; gjson
          # paths pick each node/stat. A second query feeds the 1h CPU sparkline.
          - type: custom-api
            title: Nodos
            title-url: https://grafana.home.lab
            cache: 30s
            css-class: hl-nodes
            template: |
              {{ $q := "http://prometheus-server.prometheus.svc.cluster.local/api/v1/query" }}
              {{ $r := newRequest $q | withParameter "query" `
                  label_replace(100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))), "m", "cpu", "", "")
                or label_replace(sum by (node) (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes), "m", "mem_used", "", "")
                or label_replace(sum by (node) (node_memory_MemTotal_bytes), "m", "mem_total", "", "")
                or label_replace(100 * (1 - sum by (node) (node_filesystem_avail_bytes{mountpoint="/"}) / sum by (node) (node_filesystem_size_bytes{mountpoint="/"})), "m", "disk", "", "")
                or label_replace(sum by (node) (node_filesystem_size_bytes{mountpoint="/"}), "m", "disk_size", "", "")
                or label_replace(max by (node) (node_thermal_zone_temp), "m", "temp", "", "")
                or label_replace(sum by (node) (node_load1), "m", "load", "", "")
                or label_replace(sum by (node) (time() - node_boot_time_seconds), "m", "uptime", "", "")
              ` | getResponse }}
              {{ $s := newRequest $q | withParameter "query" `(100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[2m]))))[1h:2m]` | getResponse }}
              {{ if and (eq $r.Response.StatusCode 200) (eq $s.Response.StatusCode 200) }}
              <div class="hl-node-grid">
              {{ range sortByString "metric.node" "asc" ($r.JSON.Array `data.result.#(metric.m=="cpu")#`) }}
                {{ $n := .String "metric.node" }}
                {{ $at := printf `data.result.#(metric.node=="%s")#|#(metric.m=="%%s").value.1` $n }}
                {{ $cpu := $r.JSON.Float (printf $at "cpu") }}
                {{ $mu := $r.JSON.Float (printf $at "mem_used") }}
                {{ $mt := $r.JSON.Float (printf $at "mem_total") }}
                {{ $disk := $r.JSON.Float (printf $at "disk") }}
                {{ $ds := $r.JSON.Float (printf $at "disk_size") }}
                {{ $temp := $r.JSON.Float (printf $at "temp") }}
                {{ $load := $r.JSON.Float (printf $at "load") }}
                {{ $up := $r.JSON.Float (printf $at "uptime") }}
                <div class="hl-node">
                  <div class="hl-node-head">
                    <span class="hl-node-name">{{ $n }}</span>
                    <span class="hl-dim">up {{ printf "%.0f" (div $up 86400.0) }}d</span>
                  </div>
                  <div class="hl-cpu">
                    <span class="hl-big">{{ printf "%.0f" $cpu }}<small>%</small></span>
                    <span class="hl-dim">cpu · load {{ printf "%.2f" $load }}</span>
                  </div>
                  <svg class="hl-spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
                    {{ $pts := "" }}
                    {{ range $i, $p := $s.JSON.Array (printf `data.result.#(metric.node=="%s").values` $n) }}
                      {{ $pts = printf "%s %.2f,%.2f" $pts (mul (toFloat $i) 3.333) (sub 30.0 (mul ($p.Float "1") 0.3)) }}
                    {{ end }}
                    <polygon points="0,30 {{ $pts }} 100,30" />
                    <polyline points="{{ $pts }}" />
                  </svg>
                  <div class="hl-stat"><span>ram</span><span>{{ printf "%.1f" (div $mu 1e9) }} / {{ printf "%.0f" (div $mt 1e9) }} GB</span></div>
                  <div class="hl-bar"><div style="width: {{ printf "%.0f" (mul (div $mu $mt) 100.0) }}%"></div></div>
                  <div class="hl-stat"><span>disco</span><span>{{ printf "%.0f" $disk }}% de {{ printf "%.0f" (div $ds 1e9) }} GB</span></div>
                  <div class="hl-bar"><div style="width: {{ printf "%.0f" $disk }}%"></div></div>
                  <div class="hl-stat"><span>temp</span><span class="{{ if ge $temp 75.0 }}color-negative{{ else if ge $temp 65.0 }}hl-warm{{ end }}">{{ printf "%.0f" $temp }}°C</span></div>
                </div>
              {{ end }}
              </div>
              {{ else }}
                <p class="color-negative">Prometheus no responde</p>
              {{ end }}
