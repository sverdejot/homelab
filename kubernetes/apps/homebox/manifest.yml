---
apiVersion: v1
kind: Namespace
metadata:
  name: homebox
---
# Attachments (photos, manuals, receipts). Inventory data lives in CNPG.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: homebox
  name: homebox-pvc
  namespace: homebox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homebox
  name: homebox
  namespace: homebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homebox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homebox
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:0.27.1-rootless
          env:
            - name: HBOX_DATABASE_DRIVER
              value: postgres
            - name: HBOX_DATABASE_HOST
              value: postgres-cluster-rw.postgres
            - name: HBOX_DATABASE_PORT
              value: "5432"
            - name: HBOX_DATABASE_DATABASE
              value: homebox
            - name: HBOX_DATABASE_SSL_MODE
              value: require
            - name: HBOX_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homebox-db-auth
                  key: username
            - name: HBOX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homebox-db-auth
                  key: password
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: homebox
                  key: api-key-pepper
            # Accounts are provisioned on first OIDC login; no self sign-up.
            - name: HBOX_OPTIONS_ALLOW_REGISTRATION
              value: "false"
            # Local credentials kept as break-glass if authentik is down.
            - name: HBOX_OPTIONS_ALLOW_LOCAL_LOGIN
              value: "true"
            - name: HBOX_OPTIONS_TRUST_PROXY
              value: "true"
            - name: HBOX_OPTIONS_HOSTNAME
              value: homebox.home.lab
            # SSO via authentik (blueprints/homebox.yaml)
            - name: HBOX_OIDC_ENABLED
              value: "true"
            - name: HBOX_OIDC_ISSUER_URL
              value: https://identity.home.lab/application/o/homebox/
            - name: HBOX_OIDC_CLIENT_ID
              value: homebox
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homebox-oidc
                  key: client-secret
            - name: HBOX_OIDC_SCOPE
              value: openid profile email
            - name: HBOX_OIDC_ALLOWED_GROUPS
              value: homelab-admins,homelab-users
            - name: HBOX_OIDC_BUTTON_TEXT
              value: Sign in with authentik
            # Trust the internal CA (trust-manager Bundle custom-ca-bundle) for
            # OIDC discovery; system roots stay available via SSL_CERT_DIR.
            - name: SSL_CERT_FILE
              value: /etc/homelab-ca/ca-bundle.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
          ports:
            - containerPort: 7745
          volumeMounts:
            - name: data
              mountPath: /data
            - name: homelab-ca
              mountPath: /etc/homelab-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 7745
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: 7745
            initialDelaySeconds: 15
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homebox-pvc
        - name: homelab-ca
          configMap:
            name: custom-ca-bundle
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: homebox
  name: homebox-svc
  namespace: homebox
spec:
  type: ClusterIP
  ports:
    - port: 7745
      targetPort: 7745
  selector:
    app: homebox
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homebox-ingress
  namespace: homebox
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    cert-manager.io/cluster-issuer: certificate-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - homebox.home.lab
      secretName: homebox-tls
  rules:
    - host: homebox.home.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homebox-svc
                port:
                  number: 7745
