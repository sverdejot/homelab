---
apiVersion: v1
kind: Namespace
metadata:
  name: n8n
---
# Config dir (encryption key, binary data). Workflows/credentials live in CNPG.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: n8n
  name: n8n-pvc
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: n8n
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: n8n
          image: n8nio/n8n:2.46.6
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres-cluster-rw.postgres
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-db-auth
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-db-auth
                  key: password
            - name: N8N_PORT
              value: "5678"
            - name: N8N_HOST
              value: n8n.home.lab
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.home.lab/
            - name: WEBHOOK_URL
              value: https://n8n.home.lab/
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: GENERIC_TIMEZONE
              value: Europe/Madrid
            - name: TZ
              value: Europe/Madrid
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            # Trust the internal CA so workflows can call *.home.lab services.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/homelab-ca/ca-bundle.crt
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: homelab-ca
              mountPath: /etc/homelab-ca
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-pvc
        - name: homelab-ca
          configMap:
            name: custom-ca-bundle
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: n8n
  name: n8n-svc
  namespace: n8n
spec:
  type: ClusterIP
  ports:
    - port: 5678
      targetPort: 5678
  selector:
    app: n8n
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    cert-manager.io/cluster-issuer: certificate-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - n8n.home.lab
      secretName: n8n-tls
  rules:
    - host: n8n.home.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-svc
                port:
                  number: 5678
