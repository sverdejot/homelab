---
repositories:
  - name: oauth2-proxy
    url: https://oauth2-proxy.github.io/manifests
---
releases:
  # Shared forward-auth for UIs without their own login (Longhorn, Prometheus,
  # Pi-hole, Glance). OIDC client of Pocket ID; see values/oauth2-proxy.yml.
  - name: oauth2-proxy
    namespace: oauth2-proxy
    chart: oauth2-proxy/oauth2-proxy
    version: 10.7.2
    values:
      - ./values/oauth2-proxy.yml
    hooks:
      # Pocket ID itself has no maintained chart: plain manifests.
      # DB role lives in shared/cnpg (values.yml + auth/pocketid.yml).
      - events:
          - prepare
        showlogs: true
        command: sh
        args:
          - -c
          - |
            kubectl create namespace pocket-id --dry-run=client -o yaml | kubectl apply -f -
            kubectl create namespace oauth2-proxy --dry-run=client -o yaml | kubectl apply -f -
            for f in secrets/*.yml; do sops -d "$f" | kubectl apply -f -; done
            kubectl apply -f resources/
