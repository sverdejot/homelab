---
repositories:
  - name: authentik
    url: https://charts.goauthentik.io
---
releases:
  - name: authentik
    namespace: authentik
    chart: authentik/authentik
    version: 2026.8.5
    values:
      - ./values.yml
    hooks:
      - events:
          - prepare
        showlogs: true
        command: sh
        args:
          - -c
          - |
            kubectl create namespace authentik --dry-run=client -o yaml | kubectl apply -f -
            sops -d secrets/authentik-auth.yml | kubectl apply -f -
            sops -d secrets/secret-key.yml | kubectl apply -f -
            sops -d secrets/oidc-clients.yml | kubectl apply -f -
            kubectl create configmap authentik-blueprint-homelab -n authentik --from-file=blueprints/ --dry-run=client -o yaml | kubectl apply -f -
      - events:
          - prepare
        showlogs: true
        command: sh
        args:
          - -c
          - |
            sops -d secrets/postgres.yml | kubectl apply -f -
            kubectl apply -f resources/postgres.yml -f resources/ingress.yml -f resources/outpost-ingress.yml
      - events:
          - postsync
        showlogs: true
        command: sh
        args:
          - -c
          - |
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=server -n authentik --timeout=300s
            POD=$(kubectl get pods -n authentik -l app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}')
            kubectl exec -n authentik $POD -- sh -c 'for f in /blueprints/homelab/*.yaml; do ak apply_blueprint "homelab/$(basename "$f")" || exit 1; done'
