version: 1
metadata:
  name: homelab-core
entries:
  # Role-based groups shared by every app
  - model: authentik_core.group
    identifiers:
      name: homelab-admins
    id: homelab-admins
    attrs:
      is_superuser: true

  - model: authentik_core.group
    identifiers:
      name: homelab-users
    id: homelab-users

  - model: authentik_core.group
    identifiers:
      name: homelab-readonly
    id: homelab-readonly

  # Personal admin account (password set via recovery link)
  - model: authentik_core.user
    identifiers:
      username: sverdejot
    attrs:
      name: sverdejot
      email: sverdejot@gmail.com
      type: internal
      groups:
        - !KeyOf homelab-admins

  # Force every user to enroll TOTP or a passkey on login
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - totp
        - webauthn
        - static
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  # Per-app groups replaced by the role-based ones above
  - model: authentik_core.group
    state: absent
    identifiers:
      name: ArgoCD Admins

  - model: authentik_core.group
    state: absent
    identifiers:
      name: Grafana Admins

  - model: authentik_core.group
    state: absent
    identifiers:
      name: Grafana Editors
