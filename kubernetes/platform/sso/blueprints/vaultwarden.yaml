version: 1
metadata:
  name: homelab-vaultwarden
entries:
  # Vaultwarden refuses to link/create accounts when the IdP reports
  # `email_verified: false` (authentik's default email mapping always does).
  # Emails are admin-managed here (users cannot change their own email),
  # so report them as verified for this provider only.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "Vaultwarden: OpenID 'email' (verified)"
    id: vaultwarden-scope-email
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Vaultwarden
    id: vaultwarden-provider
    attrs:
      client_id: vaultwarden
      client_secret: !Env OIDC_VAULTWARDEN_CLIENT_SECRET
      client_type: confidential
      # Blueprint-created providers default to no allowed grants in 2026.x
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://vault.home.lab/identity/connect/oidc-signin
      # RS256-signed ID tokens (HS256 breaks Vaultwarden discovery); no encryption key (JWE unsupported)
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Default 5 min collides with the Bitwarden client's 5 min expiry detection
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf vaultwarden-scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        # Needed for refresh tokens (session lifetime)
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    identifiers:
      slug: vaultwarden
    id: vaultwarden-app
    attrs:
      name: Vaultwarden
      slug: vaultwarden
      provider: !KeyOf vaultwarden-provider
      meta_launch_url: https://vault.home.lab
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/vaultwarden.svg
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf vaultwarden-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf vaultwarden-app
      group: !Find [authentik_core.group, [name, homelab-users]]
    attrs:
      order: 1
