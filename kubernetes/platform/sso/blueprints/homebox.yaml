version: 1
metadata:
  name: homelab-homebox
entries:
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Homebox
    id: homebox-provider
    attrs:
      client_id: homebox
      client_secret: !Env OIDC_HOMEBOX_CLIENT_SECRET
      client_type: confidential
      # authentik >= 2026.x: providers created via blueprint get no grant types by default
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://homebox.home.lab/api/v1/users/login/oidc/callback
      # RS256-signed ID tokens
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # profile scope also emits the `groups` claim used by HBOX_OIDC_ALLOWED_GROUPS
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    identifiers:
      slug: homebox
    id: homebox-app
    attrs:
      name: Homebox
      slug: homebox
      provider: !KeyOf homebox-provider
      meta_launch_url: https://homebox.home.lab
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/homebox.svg
      policy_engine_mode: any

  # Admins and regular users may access Homebox
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf homebox-app
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf homebox-app
      group: !Find [authentik_core.group, [name, homelab-users]]
    attrs:
      order: 1
