---
namespaceOverride: "grafana"
ingress:
  enabled: true
  annotation:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  ingressClassName: nginx
  hosts:
    - grafana.home.lab

persistence:
  enabled: true
  size: 1Gi

env:
  GF_SERVER_ROOT_URL: "https://grafana.home.lab"

# GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (sops: secrets/oidc.yml, applied by helmfile prepare hook)
envFromSecret: grafana-oidc-secret

plugins:
  - volkovlabs-echarts-panel 7.2.5

# Internal homelab CA (trust-manager Bundle) for the backchannel calls to authentik
extraConfigmapMounts:
  - name: homelab-ca
    configMap: custom-ca-bundle
    mountPath: /etc/grafana/ca
    readOnly: true

grafana.ini:
  users:
    home_page: /dashboards
  auth:
    disable_login_form: false # break-glass local admin
    signout_redirect_url: https://identity.home.lab/application/o/grafana/end-session/
  auth.anonymous:
    enabled: false
  auth.generic_oauth:
    enabled: true
    name: Authentik
    client_id: grafana
    scopes: openid profile email
    auth_url: https://identity.home.lab/application/o/authorize/
    token_url: https://identity.home.lab/application/o/token/
    api_url: https://identity.home.lab/application/o/userinfo/
    use_pkce: true
    allow_sign_up: true
    login_attribute_path: preferred_username
    name_attribute_path: name
    email_attribute_path: email
    role_attribute_path: contains(groups, 'homelab-admins') && 'GrafanaAdmin' || 'Viewer'
    role_attribute_strict: false
    allow_assign_grafana_admin: true
    tls_client_ca: /etc/grafana/ca/ca-bundle.crt

sidecar:
  datasources:
    enabled: true
    searchNamespace: "ALL"
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"

deploymentStrategy:
  type: Recreate
