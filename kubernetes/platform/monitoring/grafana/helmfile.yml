---
repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts
---
releases:
  - name: grafana
    namespace: grafana
    chart: grafana/grafana
    version: ~10.5.0
    values:
      - ./values.yml
    hooks:
      - events:
          - prepare
        showlogs: true
        command: sh
        args:
          - -c
          - |
            kubectl create namespace grafana --dry-run=client -o yaml | kubectl apply -f -
            sops -d secrets/oidc.yml | kubectl apply -f -
            kubectl -n grafana create configmap grafana-dashboards-homelab --from-file=dashboards/ --dry-run=client -o yaml \
              | kubectl label --local -f - grafana_dashboard=1 -o yaml \
              | kubectl apply --server-side -f -
