server:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: certificate-issuer
      # oauth2-proxy forward-auth (Pocket ID, see platform/sso)
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth?allowed_groups=homelab-admins
      nginx.ingress.kubernetes.io/auth-signin: https://oauth2.home.lab/oauth2/start?rd=$scheme://$host$escaped_request_uri
      nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups
    hosts:
      - prometheus.home.lab
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.home.lab

  retention: 3d

  persistentVolume:
    size: 5Gi


alertmanager:
  persistence:
    size: 256Mi

scrapeConfigs:
  kubernetes-api-servers:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: .+_bucket
        action: drop
  longhorn:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [longhorn-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
        regex: longhorn-manager;manager
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: longhorn_(volume|disk|node_storage|node_status|node_count|replica)_.+
        action: keep
