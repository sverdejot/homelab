server:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: certificate-issuer
      # authentik forward-auth (embedded outpost, see sso/blueprints/proxy.yaml)
      nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
      nginx.ingress.kubernetes.io/auth-signin: https://$host/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
      nginx.ingress.kubernetes.io/auth-response-headers: X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
      nginx.ingress.kubernetes.io/auth-proxy-set-headers: prometheus/authentik-forward-auth-headers
    hosts:
      - prometheus.home.lab
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.home.lab

  retention: 3d

  persistentVolume:
    size: 5Gi


alertmanager:
  persistence:
    size: 256Mi

scrapeConfigs:
  kubernetes-api-servers:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: .+_bucket
        action: drop
  longhorn:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [longhorn-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
        regex: longhorn-manager;manager
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: longhorn_(volume|disk|node_storage|node_status|node_count|replica)_.+
        action: keep

# Headers for the nginx auth subrequest (authentik forward-auth, referenced by
# server.ingress auth-proxy-set-headers): the embedded outpost routes by host.
extraManifests:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: authentik-forward-auth-headers
    data:
      X-Forwarded-Host: $http_host
