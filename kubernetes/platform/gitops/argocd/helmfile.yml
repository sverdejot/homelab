---
repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
---
releases:
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 10.18.0
    values:
      - ./values/argo.yml
    hooks:
      - events:
          - prepare
        showlogs: true
        command: sh
        args:
          - -c
          - |
            kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
            sops -d secrets/oidc-authentik.yml | kubectl apply -f -

  - name: argocd-image-updates
    namespace: argocd
    chart: argo/argocd-image-updater
    values:
      - ./values/image-updater.yml
