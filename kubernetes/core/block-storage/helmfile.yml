---
repositories:
  - name: longhorn
    url: https://charts.longhorn.io
---
releases:
  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    values:
      - ./values.yml
    hooks:
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "forward-auth-headers.yml"]
