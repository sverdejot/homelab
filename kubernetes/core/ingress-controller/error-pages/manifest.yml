# Custom error pages (default backend for ingress-nginx).
# Pages live in the `error-pages` ConfigMap, built from ./html and ./nginx.conf
# by the helmfile prepare hook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: ingress-nginx
  labels:
    app: error-pages
spec:
  replicas: 2
  selector:
    matchLabels:
      app: error-pages
  template:
    metadata:
      labels:
        app: error-pages
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: pages
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: pages
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pages
          configMap:
            name: error-pages
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: ingress-nginx
  labels:
    app: error-pages
spec:
  selector:
    app: error-pages
  ports:
    - name: http
      port: 80
      targetPort: http
