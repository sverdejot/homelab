# Default backend for ingress-nginx: serves the custom error pages.
# ingress-nginx forwards the original status in X-Code and the client's
# Accept header in X-Format (see custom-http-errors in values.yml).
# Requests without X-Code (unknown hosts/paths) get the 404 page.

# X-Format is only set on intercepted upstream errors; unknown hosts send the
# client's Accept header directly.
map "$http_x_format $http_accept" $fmt {
    default  html;
    "~*json" json;
}

map $http_x_code $err {
    default 404;
    "403"   403;
    "500"   500;
    "502"   502;
    "503"   503;
    "504"   504;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 403 /403.$fmt;
    error_page 404 /404.$fmt;
    error_page 500 502 503 504 /5xx.$fmt;

    location ~ ^/(403|404|5xx)\.(html|json)$ {
        internal;
        # Only the numeric status is injected; never request data (XSS).
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter "__CODE__" $err;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if ($err = 403) { return 403; }
        if ($err = 500) { return 500; }
        if ($err = 502) { return 502; }
        if ($err = 503) { return 503; }
        if ($err = 504) { return 504; }
        return 404;
    }
}
