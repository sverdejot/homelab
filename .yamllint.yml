---
extends: default
ignore: |
  .yamllint.yml
  assets

rules:
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
    level: error
  line-length: disable
  document-start: disable
  comments:
    require-starting-space: false
    min-spaces-from-content: 1
  comments-indentation: disable
  braces: disable
  brackets: disable
